services:
  h3:
    image: comfyui-minimax:local
    build:
      context: .
      args:
        BASE_IMAGE: ${BASE_IMAGE:-m.daocloud.io/docker.io/library/python:3.12-slim-bookworm@sha256:935c3c5b12357a7e10caa9c1e6ca5692344d97cf229832ef584be2cec9fc03df}
    gpus: all
    ports:
      - "127.0.0.1:6006:6006"
    environment:
      AUTO_DOWNLOAD_MODELS: ${AUTO_DOWNLOAD_MODELS:-0}
    volumes:
      - ./runtime/data:/data
      - ./runtime/input:/opt/ComfyUI/input
      - ./runtime/output:/opt/ComfyUI/output
      - ./runtime/user:/opt/ComfyUI/user
    restart: "no"
